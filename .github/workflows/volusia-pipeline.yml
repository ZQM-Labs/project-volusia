name: Volusia Data Pipeline
on:
  schedule:
    - cron: "0 6,18 * * *"
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r Tools/volusia_data/requirements.txt 2>/dev/null || pip install requests sqlite3
      - name: Run refresh pipeline
        run: cd Tools/volusia_data && python refresh_v2.py
        env:
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
          BLS_API_KEY: ${{ secrets.BLS_API_KEY }}
          BEA_API_KEY: ${{ secrets.BEA_API_KEY }}
      - name: Commit DB changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Tools/volusia_data/volusia.db
          git diff --quiet && echo "No DB changes" || git commit -m "chore: refresh volusia indicators" && git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
