name: Volusia Data Pipeline
on:
  schedule:
    - cron: "0 6,18 * * *"
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          if [ -f Tools/volusia_data/requirements.txt ]; then
            pip install -r Tools/volusia_data/requirements.txt
          else
            pip install requests
          fi
      - name: Run refresh pipeline
        run: cd Tools/volusia_data && python refresh_v2.py
        env:
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
          BLS_API_KEY: ${{ secrets.BLS_API_KEY }}
          BEA_API_KEY: ${{ secrets.BEA_API_KEY }}
      - name: Upload DB artifact
        uses: actions/upload-artifact@v4
        with:
          name: volusia-db
          path: Tools/volusia_data/volusia.db
          retention-days: 30
