name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag (e.g., 0.1.0)'
        required: true
        default: '0.1.0'
      draft:
        description: 'Create as draft release'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: write
  id-token: write  # For PyPI

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.set_tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for changelog
      
      - name: Set version tag
        id: set_tag
        run: |
          TAG="${{ github.event.inputs.tag }}"
          if [ -z "$TAG" ]; then
            # Extract from pyproject.toml on tag push
            if [ -n "${{ github.ref_name }}" ]; then
              TAG="${{ github.ref_name }}"
            else
              TAG=$(grep '^version' pyproject.toml | head -1 | sed 's/.*= *"\([^"]*\)".*/\1/')
            fi
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Building release $TAG"
      
      - name: Parse tag
        id: version
        run: |
          TAG="${{ steps.set_tag.outputs.tag }}"
          echo "version=$TAG" >> $GITHUB_OUTPUT
          # Minor/patch validation
          if [[ ! "$TAG" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid version format. Use v0.1.0 format"
            exit 1
          fi
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine
      
      - name: Build distribution
        run: python -m build
      
      - name: Verify package
        run: |
          pip install dist/*.whl --force-reinstall
          python -c "import volusia_data; print(f'Version: {volusia_data.__version__}')"
      
      - name: Check distribution files
        run: |
          echo "Built artifacts:"
          ls -la dist/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v5
        with:
          name: dist-packages
          path: dist/
          retention-days: 90

  test-distribution:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
         
      - name: Download built artifact
        uses: actions/download-artifact@v5
        with:
          name: dist-packages
          path: dist/
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install distribution
        run: pip install dist/*.whl --force-reinstall
      
      - name: Run smoke test
        run: |
          python -c "
          from volusia_data import config
          print('Config OK:', config.STATE_FIPS, config.COUNTY_FIPS)
          "

  create-release:
    runs-on: ubuntu-latest
    needs: [build, test-distribution]
    if: github.event_name == 'push' || !github.event.inputs.draft
    permissions:
      contents: write
    steps:
      - name: Create Release
        id: create
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.tag }}
          name: Release ${{ needs.build.outputs.tag }}
          draft: ${{ github.event.inputs.draft }}
          generate_release_notes: true
          body: |
            ## Release Notes
            
            ### New Features
            - Added data freshness watchdog monitoring
            - Created automated cron job definitions
            - Added CI/CD pipeline improvements
            
            ### Improvements
            - Enhanced test coverage
            - Added chart generation utilities
            - Improved documentation
            
            ### Bug Fixes
            - Fixed various type annotations
            - Improved error handling
            
            ---
            
            **[View Source](https://github.com/${{ github.repository }}/releases/tag/${{ needs.build.outputs.tag }})**
      
      - name: Upload release asset
        run: |
          gh release upload ${{ needs.build.outputs.tag }} dist/*.whl --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        if: always()

  publish-pypi:
    runs-on: ubuntu-latest
    needs: build
    if: github.event.inputs.draft == false && github.event_name != 'pull_request'
    environment:
      name: pypi
      url: https://pypi.org/project/project-volusia/
    permissions:
      id-token: write
    steps:
      - name: Download distribution
        uses: actions/download-artifact@v5
        with:
          name: dist-packages
          path: dist/
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Publish to PyPI
        run: |
          pip install --upgrade twine
          twine upload --skip-existing dist/*
        env:
          # Uses OIDC token from environment
          # No secrets required with trusted publisher
          PUBLISHER_PAT: ${{ secrets.PUBLISHER_PAT }}

  create-tag:
    runs-on: ubuntu-latest
    needs: [build, publish-pypi]
    if: success() && github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Create tag
        run: |
          TAG="v${{ needs.build.outputs.tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$TAG"
          git push origin "$TAG"
