name: Security Scan

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 6 * * 1'

# P1-020: restored permissions block (the rewrite dropped it). CodeQL
# upload-sarif needs security-events:write + actions:read for its API
# endpoints — without them the upload fails with "Resource not accessible
# by integration" (observed on run 33772220066, commit 1008aa1).
permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          format: 'sarif'
          output: 'trivy-results.sarif'
      # P1-020: v3 -> v4 (v3 deprecates Dec 2026 per CodeQL Action warning;
      # v4 already in use in supply-chain-scan.yml).
      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: 'trivy-results.sarif'
      # P1-021: gitleaks-action@v2 requires a paid GITLEAKS_LICENSE secret on
      # organization repos — it exits on licensing before scanning anything
      # (observed: "Run gitleaks" fail, run 33780238618). The official
      # container image needs no license. continue-on-error is TEMPORARY:
      # API keys remain in git history; rotate them, then remove this flag so
      # true positives block the build (Sync_Notes.md P1-018/P1-021).
      - name: Run gitleaks (official container, license-free)
        continue-on-error: true
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo ghcr.io/gitleaks/gitleaks:latest detect --source /repo --redact --verbose
