version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
  # P1-023: pip coverage — pyproject.toml [project] + requirements-dev.txt
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      pip-minor-patch:
        update-types:
          - "minor"
          - "patch"
  # Tools/requirements.txt — pipeline + portal runtime deps
  - package-ecosystem: "pip"
    directory: "/Tools"
    schedule:
      interval: "weekly"
    groups:
      pip-minor-patch:
        update-types:
          - "minor"
          - "patch"
  # contribution-api/requirements.txt — canonical FastAPI service
  - package-ecosystem: "pip"
    directory: "/contribution-api"
    schedule:
      interval: "weekly"
    groups:
      pip-minor-patch:
        update-types:
          - "minor"
          - "patch"
