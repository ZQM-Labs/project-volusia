# Project Volusia ruff config
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "project-volusia"
version = "0.1.0"
description = "Open-intelligence data pipeline, portal, and governance for Volusia County, FL"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "requests>=2.31",
    "pandas>=2.2",
    "pyarrow>=16.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "httpx>=0.27", "ruff>=0.16", "fastapi>=0.115"]

[tool.setuptools.packages.find]
where = ["Tools"]

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = [
    "build/",
    "Tools/volusia_data/refresh_v2.py",
    "Tools/volusia_data/portal_app.py",
    "Tools/volusia_data/contribution_api.py",
    "Tools/volusia_data/test_bea_api.py",
    "Tools/volusia_data/portal",
    "Tools/volusia_data/fetchers",
    "contribution-api",
    "*.md",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]
    "Tools/volusia_data/alerts/staleness_check.py" = ["E402"]
    "Tools/volusia_data/contribution/review.py" = ["E402"]
    "Tools/volusia_data/reports/generate_weekly.py" = ["E402"]
    "Tools/volusia_data/research/interviews.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
markers = [
    "network: tests that hit live external APIs (Census PEP, NOAA NCEI, BLS)",
]
